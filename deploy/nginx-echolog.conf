server {
    listen 80;
    listen [::]:80;
    server_name echolog.rb-translations.cz;

    client_max_body_size 3M;

    location /static/ {
        alias /var/www/echolog/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/echolog/gunicorn.sock;
    }
}
